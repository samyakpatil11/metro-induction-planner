services:
  - type: web
    name: metro-induction-planner
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: METRO_DEMO_MODE
        value: "true"
      - key: METRO_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: METRO_ADMIN_USERNAME
        sync: false
      - key: METRO_ADMIN_PASSWORD
        sync: false
      - key: METRO_ADMIN_NAME
        value: Depot Administrator
